<!-- templates/chat.html -->
<div class="chat-container">
    <div class="search-container">
        <input type="text" id="global-search" placeholder="Search across all chats...">
        <button id="search-button"><i class="fas fa-search"></i></button>
        <div id="search-results" class="search-results"></div>
    </div>
    <div class="chat-header">
        <a href="/chats/{{ provider }}" class="back-button">
            <i class="fas fa-arrow-left"></i> Back to chats
        </a>
        <div class="chat-title-container">
            <h1 class="chat-title">{{ chat_name }}</h1>
        <div class="chat-actions">
            <button id="new-chat-btn" class="action-button new-chat-button" title="New chat">
                <i class="fas fa-plus"></i>
                <span>New</span>
            </button>
            <button id="rename-chat-btn" class="action-button rename-button" title="Rename chat">
                <i class="fas fa-edit"></i>
                <span>Rename</span>
            </button>
            <button id="delete-chat-btn" class="action-button delete-button" title="Delete chat">
                <i class="fas fa-trash"></i>
                <span>Delete</span>
            </button>
        </div>
        <div class="chat-meta">
            <span class="model-badge">{{ current_model }}</span>
            <div class="model-selector">
                <select id="model-select">
                    {% for model in models %}
                    <option value="{{ model }}" {% if model == current_model %}selected{% endif %}>{{ model }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chat-messages">
        {% for message in history %}
        <div class="message {% if message.role == 'user' %}user-message{% else %}assistant-message{% endif %}">
            <div class="message-avatar">
                {% if message.role == 'user' %}
                <i class="fas fa-user"></i>
                {% else %}
                <i class="fas fa-robot"></i>
                {% endif %}
            </div>
            <div class="message-content">
                {{ message.content }}
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="chat-input-container">
        <div class="search-toggle">
            <input type="checkbox" id="web-search-toggle"> <!-- Добавьте checked если хотите по умолчанию -->
            <label for="web-search-toggle">Web Search</label>
        </div>
        <div class="input-wrapper">
        <div class="file-upload-buttons">
        <div class="file-upload-buttons">
            <!-- Добавьте этот input для файлов -->
            <input type="file" id="file-upload" style="display: none;" accept=".txt,.pdf,.doc,.docx,.csv,.json">
            <label for="file-upload" class="file-upload-button file-button" title="Upload file">
                <i class="fas fa-file-alt"></i>
                <span>File</span>
            </label>
            
            <!-- Добавьте этот input для изображений -->
            <input type="file" id="image-upload" style="display: none;" accept="image/*">
            <label for="image-upload" class="file-upload-button image-button" title="Upload image">
                <i class="fas fa-image"></i>
                <span>Image</span>
            </label>
        </div>
            <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="send-button" class="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
<!-- Вот сюда вставляем overlay -->
    <div class="search-overlay" id="search-overlay"></div>
</div> <!-- закрывающий тег для chat-container -->

<style>
    :root {
        --primary: #4361ee;
        --primary-light: #e0e7ff;
        --primary-dark: #3a56d4;
        --text: #1e293b;
        --text-light: #64748b;
        --text-lighter: #94a3b8;
        --background: #f8fafc;
        --card-bg: #ffffff;
        --border: #e2e8f0;
        --error: #ef4444;
        --success: #10b981;
        --radius: 12px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --transition: all 0.2s ease;
        --user-message-bg: #f1f5f9;
        --assistant-message-bg: #ffffff;
    }

.chat-container {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background-color: var(--background);
    height: 100vh; 
}

    /* Search container */
    .search-container {
        position: relative;
        padding: 1rem;
        background-color: var(--card-bg);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 0.5rem;
    }

    #global-search {
        flex: 1;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.95rem;
    }

    #search-button {
        padding: 0 1.5rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: var(--transition);
    }

    #search-button:hover {
        background: var(--primary-dark);
    }

    .search-results {
        position: absolute;
        top: calc(100% + 0.5rem);
        left: 1rem;
        right: 1rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        z-index: 100;
        display: none;
        max-height: 50vh;
        overflow-y: auto;
    }

    .search-result-item {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: var(--transition);
    }

    .search-result-item:hover {
        background: var(--primary-light);
    }

    .search-result-meta {
        font-size: 0.8rem;
        color: var(--text-light);
        margin-top: 0.25rem;
    }

    .search-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.2);
        z-index: 99;
        display: none;
    }

    /* Chat header */
    .chat-header {
        padding: 1rem 1.5rem;
        background-color: var(--card-bg);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .back-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-light);
        text-decoration: none;
        font-weight: 500;
        margin-bottom: 0.75rem;
        transition: var(--transition);
        font-size: 0.95rem;
    }

    .back-button:hover {
        color: var(--primary);
    }

    .chat-title-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .chat-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text);
        margin: 0;
        word-break: break-word;
        flex: 1;
        min-width: 200px;
    }

    .chat-actions {
        display: flex;
        gap: 0.5rem;
    }

    .action-button {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.9rem;
        cursor: pointer;
        transition: var(--transition);
        border: none;
    }

    .action-button i {
        font-size: 0.9rem;
    }

    /* Rename button */
    .rename-button {
        background-color: #e0f2fe;
        color: #0369a1;
        border: 1px solid #bae6fd;
    }

    .rename-button:hover {
        background-color: #bae6fd;
        color: #075985;
    }

    /* Delete button */
    .delete-button {
        background-color: #fee2e2;
        color: #dc2626;
        border: 1px solid #fecaca;
    }

    .delete-button:hover {
        background-color: #fecaca;
        color: #b91c1c;
    }

    .chat-meta {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: 0.875rem;
        color: var(--text-light);
        flex-wrap: wrap;
    }

    .model-badge {
        background-color: var(--primary-light);
        color: var(--primary);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-weight: 500;
        white-space: nowrap;
    }

    .model-selector select {
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background-color: var(--background);
        color: var(--text);
        font-size: 0.875rem;
        cursor: pointer;
    }


    .chat-messages {
        flex: 1;
        overflow-y: auto; 
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        scroll-behavior: smooth;
        min-height: 0; 
    }
    .message {
        display: flex;
        gap: 1rem;
        max-width: 85%;
    }

    .user-message {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .assistant-message {
        align-self: flex-start;
    }

    .message-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 0.9rem;
    }

    .user-message .message-avatar {
        background-color: #e0f2fe;
        color: #0369a1;
    }

    .assistant-message .message-avatar {
        background-color: #ecfdf5;
        color: #059669;
    }

    .message-content {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        line-height: 1.6;
        word-break: break-word;
    }

    .user-message .message-content {
        background-color: var(--user-message-bg);
        border-top-right-radius: 0;
    }

    .assistant-message .message-content {
        background-color: var(--assistant-message-bg);
        box-shadow: var(--shadow);
        border-top-left-radius: 0;
    }

    /* Message files */
    .message-files {
        margin-bottom: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .message-file {
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
    }

    .message-file img {
        max-width: 100%;
        max-height: 300px;
        display: block;
    }

    .message-file pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 0;
        font-size: 0.875rem;
        background-color: var(--background);
        padding: 0.75rem;
        max-height: 200px;
        overflow-y: auto;
    }

    /* Input area */
    .chat-input-container {
        padding: 1rem 1.5rem;
        background-color: var(--card-bg);
        border-top: 1px solid var(--border);
        position: sticky;
        bottom: 0;
    }

    .search-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-size: 0.875rem;
        color: var(--text-light);
    }

    .input-wrapper {
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
    }

    #message-input {
        flex: 1;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        resize: none;
        font-family: inherit;
        line-height: 1.5;
        max-height: 200px;
        min-height: 48px;
        transition: var(--transition);
    }

    #message-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
    }

    .send-button {
        width: 48px;
        height: 48px;
        min-height: 48px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .send-button:hover {
        background-color: var(--primary-dark);
    }

    /* File upload buttons */
    .file-upload-buttons {
        display: flex;
        gap: 0.5rem;
        margin-right: 0.5rem;
    }

    .file-upload-button {
        width: 40px;
        height: 40px;
        background-color: var(--primary-light);
        color: var(--primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
        flex-shrink: 0;
    }

    .file-upload-button:hover {
        background-color: var(--primary);
        color: white;
    }

    .uploaded-file {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
        background-color: var(--primary-light);
        border-radius: var(--radius);
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
    }

    .uploaded-file-name {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .remove-file-btn {
        background: none;
        border: none;
        color: var(--error);
        cursor: pointer;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }

    .remove-file-btn:hover {
        background-color: rgba(239, 68, 68, 0.1);
    }

    /* Loading indicator */
    .typing-indicator {
        display: flex;
        gap: 0.25rem;
        padding: 0.5rem 0;
    }

    .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: var(--text-light);
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typing {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-5px); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .chat-container {
            padding: 0;
        }
        
        .chat-header {
            padding: 1rem;
        }
        
        .chat-messages {
            padding: 1rem;
            gap: 1rem;
        }
        
        .message {
            max-width: 90%;
        }
        
        .chat-input-container {
            padding: 0.75rem;
        }
        
        .chat-title-container {
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .chat-actions {
            width: 100%;
            justify-content: flex-end;
        }
    }

    @media (max-width: 640px) {
        .action-button span,
        .file-upload-button span {
            display: none;
        }
        
        .action-button,
        .file-upload-button {
            padding: 0.5rem;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            justify-content: center;
        }
        
        .model-selector select {
            padding: 0.25rem 0.5rem;
        }
        
        .message {
            max-width: 95%;
            gap: 0.75rem;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            font-size: 0.8rem;
        }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatMessages = document.getElementById('chat-messages');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const modelSelect = document.getElementById('model-select');
    const webSearchToggle = document.getElementById('web-search-toggle');
    const renameBtn = document.getElementById('rename-chat-btn');
    const deleteBtn = document.getElementById('delete-chat-btn');
    const fileUpload = document.getElementById('file-upload');
    const imageUpload = document.getElementById('image-upload');
    const searchOverlay = document.getElementById('search-overlay');
    let uploadedFiles = [];

    // Инициализация поиска
    document.getElementById('search-button').addEventListener('click', function() {
        const query = document.getElementById('global-search').value.trim();
        if (query) {
            searchMessages(query);
            showSearchResults();
        }
    });

    document.getElementById('global-search').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') {
            const query = document.getElementById('global-search').value.trim();
            if (query) {
                searchMessages(query);
                showSearchResults();
            }
        }
    });

    // Функции для управления отображением результатов поиска
    function showSearchResults() {
        document.getElementById('search-results').style.display = 'block';
        searchOverlay.style.display = 'block';
    }

    function hideSearchResults() {
        document.getElementById('search-results').style.display = 'none';
        searchOverlay.style.display = 'none';
    }

    // Обработчик клика по оверлею
    searchOverlay.addEventListener('click', hideSearchResults);

    async function searchMessages(query) {
        if (!query) {
            hideSearchResults();
            return;
        }
        
        const resultsContainer = document.getElementById('search-results');
        resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
        
        try {
            const response = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
            const results = await response.json();
            
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">No matches found</div>';
                return;
            }
            
            resultsContainer.innerHTML = '';
            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                item.innerHTML = `
                    <div class="search-result-text">${result.text}</div>
                    <div class="search-result-meta">
                        From chat: ${result.chat_name} (${new Date(result.message_time).toLocaleString()})
                    </div>
                `;
                item.addEventListener('click', () => {
                    hideSearchResults();
                    window.location.href = `/chat/${result.chat_id}`;
                });
                resultsContainer.appendChild(item);
            });
        } catch (error) {
            resultsContainer.innerHTML = '<div class="error">Search failed</div>';
            console.error('Search error:', error);
        }
    }

    // Остальной код (обработчики файлов, сообщений и т.д.) остается без изменений
    fileUpload.addEventListener('change', handleFileUpload);
    imageUpload.addEventListener('change', handleImageUpload);

    function handleFileUpload(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            if (file.size > 5 * 1024 * 1024) {
                alert('File size too large (max 5MB)');
                return;
            }
            
            uploadedFiles.push({
                type: 'file',
                file: file,
                name: file.name,
                content: null
            });
            
            displayUploadedFile(file.name, 'file');
        });
        
        e.target.value = '';
    }

    function handleImageUpload(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            if (file.size > 5 * 1024 * 1024) {
                alert('Image size too large (max 5MB)');
                return;
            }
            
            uploadedFiles.push({
                type: 'image',
                file: file,
                name: file.name,
                content: null
            });
            
            displayUploadedFile(file.name, 'image');
        });
        
        e.target.value = '';
    }

    function displayUploadedFile(name, type) {
        const inputContainer = document.querySelector('.input-wrapper');
        const fileDiv = document.createElement('div');
        fileDiv.className = 'uploaded-file';
        
        fileDiv.innerHTML = `
            <i class="fas ${type === 'image' ? 'fa-image' : 'fa-file'}"></i>
            <span class="uploaded-file-name">${name}</span>
            <button class="remove-file-btn" data-name="${name}">
                <i class="fas fa-times"></i>
            </button>
        `;
        
        inputContainer.insertBefore(fileDiv, messageInput);
        
        // Add remove handler
        fileDiv.querySelector('.remove-file-btn').addEventListener('click', (e) => {
            const fileName = e.currentTarget.getAttribute('data-name');
            uploadedFiles = uploadedFiles.filter(f => f.name !== fileName);
            fileDiv.remove();
        });
    }
    // Auto-resize textarea
    messageInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // Send message on Enter (Shift+Enter for new line)
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Send button click
    sendButton.addEventListener('click', sendMessage);

    // Model change handler
    modelSelect.addEventListener('change', function() {
        // You could add logic here to handle model changes mid-chat
    });

    // Rename chat
    renameBtn.addEventListener('click', function() {
        const newName = prompt('Enter new chat name:', "{{ chat_name }}");
        if (newName && newName.trim() !== "") {
            renameChat(newName.trim());
        }
    });

    // Delete chat
    deleteBtn.addEventListener('click', function() {
        if (confirm('Are you sure you want to delete this chat? This cannot be undone.')) {
            deleteChat();
        }
    });

    function scrollToBottom() {
        const chatMessages = document.getElementById('chat-messages');
        if (!chatMessages) return;

        // Вариант с плавной анимацией
        const startTime = performance.now();
        const duration = 300;
        const startScrollTop = chatMessages.scrollTop;
        const distance = chatMessages.scrollHeight - chatMessages.clientHeight - startScrollTop;

        if (distance < 10) return;

        function animateScroll(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeProgress = easeOutQuad(progress);
            
            chatMessages.scrollTop = startScrollTop + (distance * easeProgress);
            
            if (progress < 1) {
                requestAnimationFrame(animateScroll);
            }
        }

        function easeOutQuad(t) {
            return t * (2 - t);
        }

        requestAnimationFrame(animateScroll);
    }

    // Функция отправки сообщения
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message && uploadedFiles.length === 0) return;

        // Чтение содержимого файлов
        for (const fileInfo of uploadedFiles) {
            try {
                fileInfo.content = await readFileContent(fileInfo.file);
            } catch (error) {
                console.error('Error reading file:', error);
                alert(`Error reading file ${fileInfo.name}`);
                return;
            }
        }

        // Добавление сообщения пользователя в UI
        addMessageToUI('user', message, uploadedFiles);
        messageInput.value = '';
        messageInput.style.height = 'auto';
        
        // Очистка UI загруженных файлов
        document.querySelectorAll('.uploaded-file').forEach(el => el.remove());
        
        // Показать индикатор загрузки
        const loadingId = addLoadingIndicator();

        try {
            const formData = new FormData();
            formData.append('message', message);
            formData.append('model', modelSelect.value);
            formData.append('use_web_search', webSearchToggle.checked);
            
            // Добавление файлов в FormData
            uploadedFiles.forEach((fileInfo, index) => {
                formData.append(`files`, fileInfo.file);  // Ключ должен быть 'files'
                formData.append(`file_types`, fileInfo.type);  // Ключ должен быть 'file_types'
            });

            // Отправка запроса
            const response = await fetch(`/api/chat/{{ chat_id }}/message`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Failed to get response');
            console.log('Sending files:', uploadedFiles);
            const data = await response.json();
            
            // Удаление индикатора загрузки и добавление ответа
            removeLoadingIndicator(loadingId);
            addMessageToUI('assistant', data.response);
            
            // Очистка загруженных файлов
            uploadedFiles = [];
            
            // Прокрутка вниз после получения ответа
            scrollToBottom();
            
        } catch (error) {
            console.error('Error:', error);
            removeLoadingIndicator(loadingId);
            addMessageToUI('assistant', "Sorry, I encountered an error. Please try again.");
            scrollToBottom();
        }
    }

    // Функция чтения содержимого файла
    function readFileContent(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(new Error('File reading failed'));
            
            if (file.type.startsWith('image/')) {
                reader.readAsDataURL(file);
            } else {
                reader.readAsText(file);
            }
        });
    }

    // Функция проверки нахождения внизу чата
    function isAtBottom(threshold = 20) {
        const chatMessages = document.getElementById('chat-messages');
        if (!chatMessages) return true;
        
        return chatMessages.scrollTop + chatMessages.clientHeight >= chatMessages.scrollHeight - threshold;
    }

    // Настройка автоматической прокрутки
    function setupAutoScroll() {
        const chatMessages = document.getElementById('chat-messages');
        if (!chatMessages) return;

        const observer = new MutationObserver(() => {
            if (isAtBottom(100)) {
                scrollToBottom();
            }
        });

        observer.observe(chatMessages, {
            childList: true,
            subtree: true,
            characterData: true
        });

        window.addEventListener('resize', () => {
            if (isAtBottom(100)) {
                scrollToBottom();
            }
        });
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        scrollToBottom();
        setupAutoScroll();
    });


    function addMessageToUI(role, content, files = []) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}-message`;
        
        let contentHtml = '';
        
        if (files.length > 0) {
            contentHtml += '<div class="message-files">';
            files.forEach(file => {
                if (file.type === 'image') {
                    contentHtml += `<div class="message-file"><img src="${file.content}" alt="${file.name}" style="max-width: 100%; max-height: 200px;"></div>`;
                } else {
                    // For text files, show first few lines
                    const textPreview = file.content.length > 200 
                        ? file.content.substring(0, 200) + '...' 
                        : file.content;
                    contentHtml += `<div class="message-file"><strong>${file.name}:</strong><pre>${textPreview}</pre></div>`;
                }
            });
            contentHtml += '</div>';
        }
        
        if (content) {
            contentHtml += `<div class="message-text">${content}</div>`;
        }
        
        messageDiv.innerHTML = `
            <div class="message-avatar">
                <span class="avatar-label">${role === 'user' ? 'Я' : 'AI'}</span>
            </div>
            <div class="message-content">
                ${contentHtml}
            </div>
        `;
        
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }

    function addLoadingIndicator() {
        const id = 'loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message assistant-message';
        loadingDiv.id = id;
        
        loadingDiv.innerHTML = `
            <div class="message-avatar">
                <span class="avatar-label">AI</span>
            </div>
            <div class="message-content">
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;
        
        chatMessages.appendChild(loadingDiv);
        scrollToBottom();
        return id;
    }

    function removeLoadingIndicator(id) {
        const element = document.getElementById(id);
        if (element) element.remove();
    }

    function scrollToBottom() {
        const chatMessages = document.getElementById('chat-messages');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function renameChat(newName) {
        try {
            const response = await fetch(`/api/chats/{{ chat_id }}/rename`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: newName })
            });
            
            if (response.ok) {
                document.querySelector('.chat-title').textContent = newName;
            }
        } catch (error) {
            console.error('Error renaming chat:', error);
            alert('Failed to rename chat. Please try again.');
        }
    }

    async function deleteChat() {
        try {
            const response = await fetch(`/api/chats/{{ chat_id }}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                window.location.href = `/chats/{{ provider }}`;
            }
        } catch (error) {
            console.error('Error deleting chat:', error);
            alert('Failed to delete chat. Please try again.');
        }
    }
    // Функция создания нового чата
    async function createNewChat() {
        try {
            const response = await fetch('/api/chats', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    provider: '{{ provider }}', // используем текущего провайдера
                    model: modelSelect.value,   // текущая выбранная модель
                    name: 'New Chat'            // начальное имя
                })
            });

            if (response.ok) {
                const data = await response.json();
                window.location.href = `/chat/${data.chat_id}`;
            } else {
                throw new Error('Failed to create chat');
            }
        } catch (error) {
            console.error('Error creating new chat:', error);
            alert('Failed to create new chat. Please try again.');
        }
    }
    const newChatBtn = document.getElementById('new-chat-btn');
    newChatBtn.addEventListener('click', createNewChat);
    // Добавьте этот код в конец вашего скрипта в chat.html
document.getElementById('new-chat-btn').addEventListener('click', createNewChat);
});
</script>
